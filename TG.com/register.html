<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>TG | Login and Register Form</title>
</head>

<body>

    <section class="login-session">

        <div class="bg-container">
            <div class="auth-container">
                <div class="logo-container">
                    <h1>TG</h1>
                </div>

                <div class="form-container">
                    <div class="form-wrapper">
                        <h2>Register for new account</h2>

                        <div class="input-container">
                             <div class="input-group">
                                <input type="text" class="text-field" id="name" placeholder="Name" />
                            </div>

                            <div class="input-group">
                                <input type="text" class="text-field" id="emailaddress" placeholder="Email Address" />
                            </div>

                            <div class="input-group">
                                <input type="password" class="text-field" id="password" placeholder="Password" />
                            </div>
                        </div>

                         <div class="btn-wrapper">
                            <button class="btn" title="register">Register</button>
                            
                        </div>

                        

                        <div class="social-icon-container">
                            <div class="icon-wrapper">
                                <div class="icon facebook"><i class="bi bi-facebook"></i></div>
                                <div class="icon twitter"><i class="bi bi-twitter-x"></i></div>
                                <div class="icon google"><i class="bi bi-google"></i></div>
                                <div class="icon linkedin"><i class="bi bi-linkedin"></i></div>
                            </div>

                            <p>Already have an account? <a href="index.html"><span>Log in</span></a></p>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </section>






</body>

</html>
