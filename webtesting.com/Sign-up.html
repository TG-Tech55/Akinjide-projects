<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>NIITITCORE | Sign-Up</title>
</head>

<body>

   
    <section class="auth-section">
        <div class="auth-background">
            <div class="overlay-bg">
                <div class="form-container">
                    <div class="form-content">
                        <div class="inner-form">
                            <div class="top-container">
                                <h2>Sign-In</h2>
                                <div class="icon-container">
                                    <div class="icon">
                                        <i class="bi bi-facebook"></i>
                                    </div>

                                    <div class="icon">
                                        <i class="bi bi-twitter-x"></i>
                                    </div>

                                </div>
                            </div>
                            <div class="input-container">
                                <div class="input-wrapper">
                                    <label>Fullname:<span>*</span></label>
                                    <input type="text" class="text-field" id="Fullname" placeholder="Enter your Fullname"/>
                                </div>
                                
                                <div class="input-wrapper">
                                    <label>Email Address:<spam>*</spam></label>
                                    <input type="text" class="text-field" id="emailaddress"
                                        placeholder="Enter your email address" />

                                </div>

                                <div class="input-wrapper">
                                    <label>Phone Number:<span>*</span></label>
                                    <input type="number" class="text-field" id="Phone" placeholder="Enter your phone number"/>

                                </div>

                                <div class="input-wrapper">
                                    <label>Password:<spam>*</spam></label>
                                    <input type="password" class="text-field" id="Password"
                                        placeholder="Enter your Password" />

                                </div>

                                <button class="btn" title="sign-Up">Sign-Up</button>

                            </div>
                        </div>




                    </div>

                    <div class="form-content  text-content">
                        <div class="text-wrapper">
                            <div class="logo-container">
                                <img src="all-images/icon-images/niit-logo.png" alt="NIIT logo">
                            </div>

                            <div class="title">
                                <h1>Welcome to Student Portal</h2>
                                <p>Already have an account</p>
                            </div>

                            <a href="sign-in.html">
                                 <button class="btn" title="Sign-In">Sign In</button>
                            </a>

                           


                        </div>

                    </div>

                </div>
            </div>





        </div>

    </section>
</body>

</html>
