<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>TG | Egba page</title>
</head>

<body>
    <section class="auth-section">
        <div class="container">
            <div class="left-container">
                <div class="inner-wrapper">
                    <img src="all-image/body-image/woman1.jfif">

                    <div class="left-btn">
                        <button class="btn" title="Log in">Login</button>
                        <a href="register-form.html">
                            <button class="btn" title="register">Register</button>
                        </a>
                    </div>

                </div>
            </div>


            <div class="right-container">


                <div class="form-container">
                    <h1>Egba</h1>

                    <div class="form-wrapper">
                        <h2>Log In</h2>
                        <P>Log in to continue in our website</P>
                    </div>

                    <div class="input-container">
                        <div class="input-group">
                            <input type="text" class="text-field" id="emailaddress" placeholder="Email Address" />
                        </div>

                        <div class="input-group">
                            <input type="password" class="text-field" id="password" placeholder="Password" />
                        </div>

                    </div>

                    <div class="btn-wrapper">
                        <button class="btn" title="Log In">Log In</button>
                        <a href="forgot-password.html">
                            <p>Forgot Password</p>
                        </a>

                    </div>
                    <h5>Or Login with:</h5>

                    <div class="icon-container">
                        <div class="icon-wrapper">
                            <div class="icon facebook"><i class="bi bi-facebook"></i></div>
                            <div class="icon twitter"><i class="bi bi-twitter-x"></i></div>
                            <div class="icon google"><i class="bi bi-google"></i></div>
                            <div class="icon linkedin"><i class="bi bi-linkedin"></i></div>
                            <div class="icon pinterest"><i class="bi bi-pinterest"></i></div>
                        </div>

                    </div>



                </div>
            </div>

        </div>

    </section>













</body>

</html>
